receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 100ms
    limit_mib: 256
    spike_limit_mib: 64
  filter/privacy_links:
    error_mode: propagate
    traces:
      span:
        - Len(links) > 0
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: span
        statements:
          - keep_keys(resource.attributes, ["task_id", "session_id", "producer", "config_sha256", "policy_sha256"])
          - keep_keys(scope.attributes, [])
          - set(scope.name, "synthetic")
          - set(scope.version, "1")
          - set(name, "synthetic")
          - keep_keys(attributes, ["event_id"])
          - set(status.message, "")
          - set(trace_state, "")
          - set(resource.schema_url, "")
          - set(scope.schema_url, "")
      - context: spanevent
        statements:
          - set(name, "synthetic")
          - keep_keys(attributes, [])
exporters:
  file:
    path: /output/observed.jsonl
    flush_interval: 100ms
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  telemetry:
    logs:
      level: error
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/privacy_links, transform/privacy]
      exporters: [file]
